# 12FactorApp: committed working dev defaults; env overrides. (yml-only rule, configuration.md p19)
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    # dcre_pay, NOT dcre_col: the payments split gives this family its own database,
    # and that database is now the family discriminator. This default said dcre_col
    # until SCRUM-107 because the repo is dcre-ais cloned, and the collections
    # datasource came across unchanged. A clean clone therefore built the whole PAI
    # schema, its pai_databasechangelog, AND wrote account rows (AccountRepo's
    # INSERT INTO account) inside the COLLECTIONS database, with no error at all:
    # the write is perfectly valid against the wrong database.
    #
    # DCRE_DB_URL is the wire contract with AGT, which injects exactly this name into
    # every stage Job it launches and routes the value per family
    # (agt StageDatabases.urlFor -> Flow.PAY -> payServiceDbUrl). One variable routed
    # per family, never one variable name per family.
    url: ${DCRE_DB_URL:jdbc:postgresql://localhost:26257/dcre_pay?sslmode=disable}
    username: ${DCRE_DB_USER:root}
    password: ${DCRE_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Per-service migration history in dcre_pay (same isolation idea as PAI_BATCH_)
    database-change-log-table: pai_databasechangelog
    database-change-log-lock-table: pai_databasechangeloglock

dcre:
  # Telemetry marker, read by platform-batch. Everything else about telemetry (the service name,
  # the instance id, the export flag, the flush, the log appender and the trace context) is
  # resolved inside the library, so this file carries no telemetry configuration of its own and
  # cannot drift from its 29 siblings.
  #
  # Disabled by default: a service run outside the orchestrator behaves exactly as before, and a
  # fresh clone runs with no .env at all (12FactorApp Alignment, https://12factor.net/).
  telemetry:
    enabled: ${DCRE_TELEMETRY_ENABLED:false}
    # OPTIONAL override. Left unset, the library takes this service's own application package
    # leaf, so no service restates its own name here.
    stage: ${DCRE_TELEMETRY_STAGE:}
  batch:
    table-prefix: PAI_BATCH_
  agtops-db-url: ${DCRE_AGTOPS_DB_URL:jdbc:postgresql://localhost:26257/agt_ops?sslmode=disable}
  agtops-db-user: ${DCRE_AGTOPS_DB_USER:root}
  agtops-db-password: ${DCRE_AGTOPS_DB_PASSWORD:}
  # Used only for the AGT outcome seam write (R-35); PAI does no boundary-file I/O (R-30).
  exchange-root: ${DCRE_EXCHANGE_ROOT:../../../../../../infra/dcre-infra/exchange}
  pai:
    # SCRUM-42: verdict writes commit in bounded sequence slices; one giant
    # serializable tx is unrefreshable at 300k tx (RETRY_SERIALIZABLE).
    verdict-slice-size: ${DCRE_PAI_VERDICT_SLICE_SIZE:10000}
